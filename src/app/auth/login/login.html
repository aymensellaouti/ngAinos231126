<form [formRoot]="loginForm">
  <div class="form-group">
    <label for="exampleInputEmail1">Email address</label>
    <input [formField]="loginForm.email" type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
      placeholder="Enter email">
    @if (loginForm.email().getError('email'); as emailError) {
      <div class="alert alert-danger">{{ emailError.message }}</div>
    }

    <small id="emailHelp" class="form-text text-muted">We'll never share your email with anyone else.</small>
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Password</label>
    <input [formField]="loginForm.password" type="password" class="form-control" id="exampleInputPassword1" placeholder="Password">

  </div>
  <button [disabled]="loginForm().invalid()" type="submit" class="btn btn-primary">Submit</button>
</form>
