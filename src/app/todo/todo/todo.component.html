<div class="row">
  <div class="col">
    <ol class="list-group">
      @for (todo of todos(); track $index) {
      <li class="list-group-item">
        {{todo.name}} {{todo.content}}
        <i (click)="deleteTodo(todo)" class="bi bi-trash2"></i>
      </li>
      }
    </ol>
  </div>
  <div class="col">
    <form [formRoot]="todoForm">
    name:
    <input [formField]="todoForm.name" type="text" class="form-control" /> content:
    <input [formField]="todoForm.content" type="text" class="form-control" />
    <button
      (click)="addTodo()"
      [disabled]="todoForm().invalid()"
      class="btn btn-primary m-2">
      add
    </button>
    </form>
  </div>
</div>
