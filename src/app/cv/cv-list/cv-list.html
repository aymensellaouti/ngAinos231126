<ol class="list list-group">
  @for (cv of cvs(); track cv.id) {
    <li
      class="list list-group list-group-item"
      [class]="{
        'list-group-item-primary':$odd,
        'list-group-item-secondary':$even,
      }"
    >
      <app-cv-item (selectCv)="forwardCv.emit($event)" [cv]="cv" />
    </li>
  }
</ol>
