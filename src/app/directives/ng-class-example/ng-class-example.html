<p
  (click)="isOn.update((old) =>!old)"
  [class]="{
    'on': isOn(),
    'off': !isOn(),
  }"
>
ng-class-example works!</p>

<p appRainbow appHighlight>test highlight</p>
<p appHighlight [in]="'green'">test highlight</p>
<p appHighlight [out]="'gold'" [in]="'silver'" >test highlight</p>
<input type="text" appRainbow>
<input type="color" appRainbow>
<input type="date" appRainbow>
<textarea name="" appRainbow></textarea>
